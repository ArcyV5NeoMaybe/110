<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millennium Dawn at Home</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d151e;
    color: #e9eef4;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.top {
    height: 88px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #16212d;
    border-bottom: 2px solid #243343;
}

.title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
}

.date {
    font-size: 18px;
    color: #9fb1c4;
}

.flag-button {
    position: relative;
    margin: 24px 0 0 26px;
    width: min(470px, calc(100vw - 52px));
    aspect-ratio: 1.9 / 1;
    border: 1px solid #40546a;
    border-radius: 9px;
    overflow: hidden;
    cursor: pointer;
    background: #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

.flag-stripes {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        #b22234 0%,
        #b22234 7.69%,
        #ffffff 7.69%,
        #ffffff 15.38%
    );
}

.flag-canton {
    position: absolute;
    top: 0;
    left: 0;
    width: 40%;
    height: 53.85%;
    background: #3c3b6e;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding: 5px 7px;
}

.star-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.star {
    color: white;
    font-size: clamp(8px, 1.8vw, 16px);
    line-height: 1;
}

.country-panel {
    width: min(520px, calc(100vw - 50px));
    margin: 0 0 30px 25px;
    padding: 0 20px 20px;
    background: #17232f;
    border: 1px solid #33475b;
    border-radius: 0 0 9px 9px;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.president-card {
    margin-top: 14px;
    overflow: hidden;
    border: 1px solid #33475b;
    border-radius: 9px;
    background: #111c27;
}

.president-image {
    display: block;
    width: 100%;
    height: 390px;
    object-fit: cover;
    object-position: center top;
    background: #101820;
}

.president-info {
    padding: 18px 18px 20px;
}

.president-name {
    font-size: 25px;
    font-weight: 700;
}

.president-role {
    margin-top: 6px;
    font-size: 17px;
    color: #aab8c7;
}

.country-title {
    margin: 30px 0 14px;
    padding-bottom: 12px;
    border-bottom: 2px solid #40566b;
    font-size: 23px;
    color: #b6c5d4;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.menu-button {
    width: 100%;
    min-height: 64px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #35495c;
    border-radius: 8px;
    background: #202d3a;
    color: #edf2f7;
    font-size: 20px;
    cursor: pointer;
    transition: .15s;
}

.menu-button:hover {
    background: #293847;
    border-color: #526a80;
}

.menu-button:active {
    transform: scale(.99);
}

.menu-arrow {
    font-size: 25px;
    color: #a9bfd3;
}

.main {
    position: absolute;
    left: 58%;
    right: 4%;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
}

.main h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 58px);
}

.main p {
    margin-top: 20px;
    color: #94a8bb;
    font-size: clamp(16px, 2vw, 23px);
}

@media (max-width: 800px) {
    .top {
        height: 75px;
        padding: 0 18px;
    }

    .title {
        font-size: 22px;
    }

    .date {
        display: none;
    }

    .flag-button {
        margin-left: 18px;
        width: calc(100vw - 36px);
    }

    .country-panel {
        width: calc(100vw - 36px);
        margin-left: 18px;
        padding: 0 14px 16px;
    }

    .president-image {
        height: 330px;
    }

    .main {
        position: static;
        transform: none;
        margin: 50px 25px;
    }

    .menu-button {
        min-height: 58px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header class="top">
    <div class="title">MILLENNIUM DAWN AT HOME</div>
    <div class="date" id="gameDate">01 January 2000 — 00:00</div>
</header>

<button class="flag-button" id="flagButton" aria-label="United States">
    <div class="flag-stripes"></div>
    <div class="flag-canton" id="flagStars"></div>
</button>

<section class="country-panel" id="countryPanel">

    <div class="president-card">
        <img
            class="president-image"
            src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Bill_Clinton.jpg"
            alt="William Jefferson Clinton"
        >

        <div class="president-info">
            <div class="president-name">William Jefferson Clinton</div>
            <div class="president-role">President of the United States</div>
        </div>
    </div>

    <div class="country-title">UNITED STATES</div>

    <div class="menu">
        <button class="menu-button">
            <span>Dashboard</span>
            <span class="menu-arrow">›</span>
        </button>

        <button class="menu-button">
            <span>Economy</span>
            <span class="menu-arrow">›</span>
        </button>

        <button class="menu-button">
            <span>Military</span>
            <span class="menu-arrow">›</span>
        </button>

        <button class="menu-button">
            <span>Politics</span>
            <span class="menu-arrow">›</span>
        </button>

        <button class="menu-button">
            <span>Diplomacy</span>
            <span class="menu-arrow">›</span>
        </button>

        <button class="menu-button">
            <span>Technology</span>
            <span class="menu-arrow">›</span>
        </button>

        <button class="menu-button">
            <span>Decisions</span>
            <span class="menu-arrow">›</span>
        </button>
    </div>

</section>

<main class="main">
    <h1>United States</h1>
    <p>Click the flag to open country options</p>
</main>

<script>
const flagStars = document.getElementById("flagStars");

for (let row = 0; row < 9; row++) {
    const rowElement = document.createElement("div");
    rowElement.className = "star-row";

    const amount = row % 2 === 0 ? 6 : 5;

    for (let i = 0; i < amount; i++) {
        const star = document.createElement("span");
        star.className = "star";
        star.textContent = "★";
        rowElement.appendChild(star);
    }

    flagStars.appendChild(rowElement);
}

const flagButton = document.getElementById("flagButton");
const countryPanel = document.getElementById("countryPanel");

flagButton.addEventListener("click", () => {
    countryPanel.hidden = !countryPanel.hidden;
});

countryPanel.hidden = false;

let gameDate = new Date(2000, 0, 1, 0, 0, 0);
let lastTime = performance.now();

function updateDate() {
    const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];

    const day = String(gameDate.getDate()).padStart(2, "0");
    const month = months[gameDate.getMonth()];
    const year = gameDate.getFullYear();
    const hour = String(gameDate.getHours()).padStart(2, "0");
    const minute = String(gameDate.getMinutes()).padStart(2, "0");

    document.getElementById("gameDate").textContent =
        `${day} ${month} ${year} — ${hour}:${minute}`;
}

function gameLoop(currentTime) {
    const delta = (currentTime - lastTime) / 1000;
    lastTime = currentTime;

    gameDate = new Date(gameDate.getTime() + delta * 2 * 60 * 60 * 1000);

    updateDate();
    requestAnimationFrame(gameLoop);
}

updateDate();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
